name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick a random snake color
        run: |
          COLORS=("white" "black" "red" "blue" "#39d353" "orange" "purple" "yellow")
          RANDOM_COLOR=${COLORS[$RANDOM % ${#COLORS[@]}]}
          echo "SNAKE_COLOR=$RANDOM_COLOR" >> $GITHUB_ENV
          echo "Picked color: $RANDOM_COLOR"

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=${{ env.SNAKE_COLOR }}&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=${{ env.SNAKE_COLOR }}&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
