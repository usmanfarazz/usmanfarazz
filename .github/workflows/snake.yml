name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=white&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=white&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Make the snake rainbow
        run: |
          sudo python3 - <<'EOF'
          import re, glob
          RAINBOW = ("@keyframes rainbow{0%{fill:#ffffff}12%{fill:#ff3b3b}25%{fill:#ff9f1a}"
                     "37%{fill:#ffe01a}50%{fill:#3ddc4b}62%{fill:#1ac8ff}75%{fill:#4b6bff}"
                     "87%{fill:#b44bff}100%{fill:#ffffff}}")
          for path in glob.glob("dist/*.svg"):
              svg = open(path).read()
              m = re.search(r"\.s\{[^}]*animation:none linear (\d+)ms infinite", svg)
              if not m:
                  print("snake rule not found in", path); continue
              dur = m.group(1)
              segs = sorted(set(re.findall(r'class="s (s\d+)"', svg)))
              rules = "".join(
                  f".s.{s}{{animation:{s} {dur}ms linear infinite,rainbow 3s linear infinite;animation-delay:0s,-{i*0.2:.1f}s}}"
                  for i, s in enumerate(segs))
              svg = svg.replace("</style>", RAINBOW + rules + "</style>", 1)
              open(path, "w").write(svg)
              print("rainbow added to", path, "segments:", segs)
          EOF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
